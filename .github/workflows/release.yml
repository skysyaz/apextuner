name: Release APK

on:
  push:
    tags:
      - 'v*'   # pushing a tag like v1.0.0 triggers a release
  workflow_dispatch:

permissions:
  contents: write   # needed to create the GitHub Release and upload the asset

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Rename APK to include tag
        id: name
        run: |
          tag="${GITHUB_REF_NAME:-manual}"
          cp app/build/outputs/apk/debug/app-debug.apk "apextuner-${tag}.apk"
          echo "apk=apextuner-${tag}.apk" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and attach APK
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.name.outputs.apk }}
          generate_release_notes: true
          draft: false
          prerelease: false